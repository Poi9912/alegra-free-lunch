name: Test, Security & Code Analysis for API
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'PLANNING.md'
      - '*compose.yaml'
    paths:
      - 'api/**'
  workflow_call:

jobs:
  scan:
    runs-on: docker
    container:
      image: quay.io/podman/stable
    defaults:
      run:
        working-directory: ./api
    steps:
      - run: |
          echo "prepare scan environment"
          dnf install -y node git

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies for coverage
        run: npm ci --include=dev
      - name: Run tests
        run: npm run test:coverage

      - name: Debug URL Variables
        run: |
          echo "Sonar URL is '${{ vars.SONAR_URL }}'"
          echo "Sonar URL is '${{ vars.DTRACK_API_URL }}'"

      - name: SonarQube Scan
        uses: https://github.com/sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}

      - name: Generate SBOM via Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --format cyclonedx --output sbom.json .

      - name: Upload SBOM to Dependency-Track
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_API_URL: ${{ vars.DTRACK_API_URL }}
        run: |
          # Parse sonar.projectKey from sonar-project.properties
          PROJECT_NAME=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d'=' -f2 | tr -d ' "\r')

          # Fallback to repository name if not found in properties file
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${GITHUB_REPOSITORY#*/}-api"
          fi

          echo "Extracted project name for Dependency-Track: $PROJECT_NAME"

          CALL_URL="${DTRACK_API_URL}/api/v1/bom"
          echo "Uploading SBOM to: ${CALL_URL}"

          curl -X "POST" "$CALL_URL" \
               -H 'Content-Type: multipart/form-data' \
               -H "X-Api-Key: $DTRACK_API_KEY" \
               -F "autoCreate=true" \
               -F "projectName=${PROJECT_NAME}" \
               -F "projectVersion=${{ github.ref_name }}" \
               -F "bom=@sbom.json"