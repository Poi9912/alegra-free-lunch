services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB_: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/model.sql:/docker-entrypoint-initdb.d/01-model.sql
      - ./db/init.sql:/docker-entrypoint-initdb.d/02-init.sql
    secrets:
      - db_name
      - db_user
      - db_password
    networks:
      - internal-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d${DB_NAME}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    #image: alegra-api:latest
    build:
      context: ./api
      file: Dockerfile
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - internal-net
    depends_on:
      - db
      - redis
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure

  worker-selector:
    #image: alegra-worker-selector:latest
    build:
      context: ./brokers
      file: Dockerfile
    command: ["node", "recipeSelectorWorker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      BATCH_COUNT: ${BATCH_COUNT}
    networks:
      - internal-net
    depends_on:
      - db
      - redis
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  worker-purchasing:
    #image: alegra-worker-purchasing:latest
    build:
      context: ./brokers
      file: Dockerfile
    command: ["node", "purchasingAgentWorker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      EXTERNAL_API: ${EXTERNAL_API}
      BATCH_COUNT: ${BATCH_COUNT}
    networks:
      - internal-net
    depends_on:
      - db
      - redis
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  worker-cooking:
    #image: alegra-worker-cooking:latest
    build:
      context: ./brokers
      file: Dockerfile
    command: ["node", "cookingSimulatorWorker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      BATCH_COUNT: ${BATCH_COUNT}
    networks:
      - internal-net
    depends_on:
      - db
      - redis
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  worker-delivery:
    #image: alegra-worker-delivery:latest
    build:
      context: ./brokers
      file: Dockerfile
    command: ["node", "deliverySimulatorWorker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      BATCH_COUNT: ${BATCH_COUNT}
    networks:
      - internal-net
    depends_on:
      - db
      - redis
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    #image: alegra-front:latest
    build:
      context: ./front
      file: Dockerfile
      args:
        - BACKEND_URL=http://api:3000
    environment:
      PORT: 3000
      BACKEND_URL: http://api:3000
    ports:
      - "4000:3000"
    networks:
      - internal-net
      - external-net
    depends_on:
      - api
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure

volumes:
  pg_data:
  redis_data:

networks:
  internal-net:
    driver: overlay
    internal: true
  external-net:
    driver: bridge